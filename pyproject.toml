[project]
name = "paper-impact"
version = "0.1.1"
description = "Which papers at AI venues mattered: citations and field-normalized impact from OpenAlex, by venue and year, with coverage against official counts; open JSON and a static site."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "zch6a" }]
keywords = ["openalex", "citations", "bibliometrics", "machine-learning", "conferences", "neurips", "icml", "iclr", "research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
# No dependencies: urllib for the pages and the API, html.parser for the proceedings, one static page for the site.
dependencies = []

[project.urls]
Homepage = "https://github.com/zch6a/paper-impact"
Issues = "https://github.com/zch6a/paper-impact/issues"

[project.scripts]
paper-impact = "paper_impact.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_impact"]

[tool.hatch.build.targets.sdist]
exclude = ["docs/"]  # images for the GitHub page only

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
pythonpath = ["src", "tests"]
addopts = "--doctest-modules --import-mode=importlib"

[tool.mypy]
python_version = "3.10"
files = ["src/paper_impact"]
ignore_missing_imports = true

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/paper_impact/site.py" = ["E501"]  # the page's markup and script, kept as written
