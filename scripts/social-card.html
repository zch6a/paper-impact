<!doctype html>
<!-- The repository's social preview (1280×640): docs/social-preview.png, rendered from this page with headless Chrome
     (chrome --headless --screenshot --window-size=1280,640). docs/site.png is the site itself, in dark mode, NeurIPS,
     all years, as the daily build publishes it. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body { background: radial-gradient(1100px 700px at 12% 8%, #13233d 0%, #12141a 55%, #0b0d11 100%); color: #e6edf3;
    font-family: "Segoe UI", -apple-system, system-ui, sans-serif; display: grid; grid-template-columns: 440px 1fr; gap: 40px;
    padding: 0 0 0 70px; box-sizing: border-box; align-items: center; }
  h1 { font-size: 60px; margin: 0 0 16px; letter-spacing: -1.5px; }
  h1 span { color: #58a6ff; }
  .tag { font-size: 31px; line-height: 1.22; margin: 0 0 22px; font-weight: 600; }
  .sub { font-size: 18.5px; line-height: 1.5; color: #b1bac4; margin: 0 0 26px; }
  .pills { display: flex; gap: 9px; flex-wrap: wrap; }
  .pills span { font-size: 14.5px; border: 1px solid #30363d; background: #161b22; border-radius: 999px; padding: 6px 12px; color: #c9d1d9; }
  .shot { height: 540px; overflow: hidden; border: 1px solid #30363d; border-right: 0; border-radius: 10px 0 0 10px;
    box-shadow: 0 18px 50px rgba(0,0,0,.55); }
  .shot img { width: 900px; display: block; }
</style>
</head>
<body>
  <div>
    <h1>paper-<span>impact</span></h1>
    <p class="tag">Which papers at AI venues mattered.</p>
    <p class="sub">Every paper NeurIPS, ICML, ICLR, CVPR and ACL published, with its citations and field-normalized impact from OpenAlex, by venue and year.</p>
    <div class="pills"><span>70,000 papers</span><span>OpenAlex</span><span>Open JSON</span><span>Rebuilt daily</span></div>
  </div>
  <div class="shot"><img src="../docs/site.png" alt=""></div>
</body>
</html>
